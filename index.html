const app = document.getElementById('app');

function el(html){ const tpl = document.createElement('template'); tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; }

function renderThread(fraction){
  const segs = 10;
  let html = '<div class="thread">';
  for(let i=0;i<segs;i++){
    const segFraction = fraction*segs - i;
    if(segFraction >= 1) html += `<div class="stitch done"></div>`;
    else if(segFraction > 0) html += `<div class="stitch current" style="--fillpct:${Math.round(segFraction*100)}%"></div>`;
    else html += `<div class="stitch"></div>`;
  }
  html += '</div>';
  return html;
}

function overallProgress(){
  if(!state.category) return 0.03;
  const cat = CATEGORIES[state.category];
  const totalSections = cat.sections.length;
  let unit = 1/totalSections;
  let base = state.sectionIdx * unit;
  const sec = cat.sections[state.sectionIdx];
  if(sec && sec.type === 'scale') base += unit * (state.itemIdx / sec.items.length);
  return Math.min(0.97, 0.08 + base*0.9);
}

function frame(innerHTML, {progress=null} = {}){
  app.innerHTML = '';
  if(progress !== null) app.insertAdjacentHTML('beforeend', renderThread(progress));
  const wrap = el(`<div class="page-frame">${innerHTML}</div>`);
  app.appendChild(wrap);
  window.scrollTo({top:0, behavior:'smooth'});
}

function screenScreening(){
  state.screen = 'screening';
  frame(`
    <p class="eyebrow">${t('Quick check','দ্রুত যাচাই')}</p>

    <div class="field">
      <label>${t('Do you (and your household) currently live in an urban area of Dhaka or any other cities of Bangladesh, or did you grow up in one?',

      <div class="pill-group" id="pg-dhaka">
        <button class="pill" data-val="yes">${t('Yes','হ্যাঁ')}</button>
        <button class="pill" data-val="no">${t('No','না')}</button>
      </div>
    </div>
    <div class="field">
      <label>${t('Are you currently receiving psychiatric treatment for a trauma-related condition?',
        'আপনি কি বর্তমানে কোনো মানসিক আঘাত-সম্পর্কিত অবস্থার জন্য মনোরোগ চিকিৎসা নিচ্ছেন?')}</label>
      <p class="hint">${t("We ask only because a couple of later questions touch on difficult family memories, and we'd rather you not encounter them right now if that's the case. There's no wrong answer.",
        'আমরা শুধু এই কারণে জিজ্ঞাসা করছি যে পরবর্তী কিছু প্রশ্ন কঠিন পারিবারিক স্মৃতি স্পর্শ করে, এবং তেমনটা হলে আমরা চাই না আপনি এখন সেগুলোর মুখোমুখি হন। এখানে কোনো ভুল উত্তর নেই।')}</p>
      <div class="pill-group" id="pg-trauma">
        <button class="pill" data-val="yes">${t('Yes','হ্যাঁ')}</button>
        <button class="pill" data-val="no">${t('No','না')}</button>
        <button class="pill" data-val="prefer">${t('Prefer not to say','বলতে চাই না')}</button>
      </div>
    </div>
    <p class="error-text" id="screen-err">${t('Please answer both questions to continue.','চালিয়ে যেতে অনুগ্রহ করে দুটি প্রশ্নেরই উত্তর দিন।')}</p>
    <div class="actions">
      <button class="btn btn-primary" id="btn-screen-next">${t('Continue','চালিয়ে যান')}</button>
      <button class="btn btn-ghost" id="btn-screen-back">${t('Back','পেছনে যান')}</button>
    </div>
  `, {progress: 0.08});

  let dhaka = null, trauma = null;
  document.querySelectorAll('#pg-dhaka .pill').forEach(b=>{ b.onclick = () => { dhaka = b.dataset.val; setSelected('#pg-dhaka', b); }; });
  document.querySelectorAll('#pg-trauma .pill').forEach(b=>{ b.onclick = () => { trauma = b.dataset.val; setSelected('#pg-trauma', b); }; });

  document.getElementById('btn-screen-back').onclick = () => goTo('consent');
  document.getElementById('btn-screen-next').onclick = async () => {
    if(!dhaka || !trauma){ document.getElementById('screen-err').classList.add('show'); return; }
    if(dhaka === 'no'){ await saveToFirestore('screened_out', { reason:'not_urban_dhaka' }); screenGoodbye('notUrban'); return; }
    if(trauma === 'yes'){ await saveToFirestore('screened_out', { reason:'trauma_exclusion' }); screenGoodbye('traumaExclusion'); return; }
    state.screening = { dhaka, trauma };
    goTo('category');
  };
}

function setSelected(groupSel, btn){
  document.querySelectorAll(groupSel + ' .pill').forEach(p=>p.classList.remove('selected'));
  btn.classList.add('selected');
}

    <h2 class="display" lang="${state.lang}">${t("You're free to go",'আপনি চাইলে চলে যেতে পারেন')}</h2>
    <p class="lede">${msg}</p>
    ${other ? `<p class="bn-line">${other}</p>` : ''}
    <p class="fine">${t("You can close this tab now, or return to the start if you'd like to look around again.",
      'আপনি এখন এই ট্যাবটি বন্ধ করতে পারেন, অথবা আবার দেখতে চাইলে শুরুতে ফিরে যেতে পারেন।')}</p>

    <p class="lede">${t('The questions ahead are tailored to your role, so pick whichever fits best.','সামনের প্রশ্নগুলো আপনার ভূমিকা অনুযায়ী সাজানো, তাই যেটি সবচেয়ে উপযুক্ত মনে হয় সেটি বেছে নিন।')}</p>

/* ---------- section renderer dispatcher ---------- */
function renderSection(){
  state.screen = 'survey';
  const cat = CATEGORIES[state.category];
  const sec = cat.sections[state.sectionIdx];
  if(!sec){ state.screen = 'finish'; return screenFinish(); }
  if(sec.type === 'demo') return renderDemoSection(sec);
  if(sec.type === 'checkpoint') return renderCheckpoint(sec);
  if(sec.type === 'scale') return renderScaleItem(sec);
  if(sec.type === 'open') return renderOpenSection(sec);
}

function nextSection(){ state.sectionIdx += 1; state.itemIdx = 0; saveDraft(); renderSection(); }

/* ---------- demographic form ---------- */
function renderDemoSection(sec){
  const fieldsHtml = sec.fields.map(f => {
    const existing = state.demographics[f.key] ?? '';
    const labelHtml = `${t(f.label,f.label_bn)}${f.required?'':` <span style="font-weight:400;color:var(--ink-soft);">(${t('optional','ঐচ্ছিক')})</span>`}${state.lang==='en'?bnLine(f.label_bn):''}`;
    if(f.kind === 'select'){
      const opts = f.options.map((o,i)=>{
        const olabel = state.lang==='bn' && f.options_bn ? f.options_bn[i] : o;
        return `<option value="${o}" ${existing===o?'selected':''}>${olabel}</option>`;
      }).join('');
      return `
        <div class="field" data-key="${f.key}">
          <label>${labelHtml}</label>
          <select>
            <option value="" ${existing===''?'selected':''} disabled>${t('Choose one…','একটি বেছে নিন…')}</option>
            ${opts}
          </select>
          ${f.hint?`<div class="hint">${t(f.hint,f.hint_bn)}${state.lang==='en'?bnLine(f.hint_bn):''}</div>`:''}
          <div class="error-text">${t('Please make a selection.','অনুগ্রহ করে একটি নির্বাচন করুন।')}</div>
        </div>`;
    }
    if(f.kind === 'number'){
      return `
        <div class="field" data-key="${f.key}">
          <label>${labelHtml}</label>
          <input type="number" min="${f.min??''}" max="${f.max??''}" value="${existing}">
          ${f.hint?`<div class="hint">${t(f.hint,f.hint_bn)}${state.lang==='en'?bnLine(f.hint_bn):''}</div>`:''}
          <div class="error-text">${t('Please enter a valid number.','অনুগ্রহ করে সঠিক সংখ্যা লিখুন।')}</div>
        </div>`;
    }
    return `
      <div class="field" data-key="${f.key}">
        <label>${labelHtml}</label>
        <input type="text" value="${existing}">
        ${f.hint?`<div class="hint">${t(f.hint,f.hint_bn)}</div>`:''}
      </div>`;
  }).join('');

  frame(`
    <p class="eyebrow">${t(CATEGORIES[state.category].label,CATEGORIES[state.category].label_bn)} ${t('questionnaire','প্রশ্নমালা')} — ${t('Section','অংশ')} ${sec.id}</p>
    <h2 class="display" lang="${state.lang}">${t(sec.title,sec.title_bn)}</h2>
    ${state.lang==='en'&&sec.title_bn ? `<p class="bn-line" style="margin-top:-10px;">${sec.title_bn}</p>`:''}
    ${sec.note?`<p class="lede">${t(sec.note,sec.note_bn)}${state.lang==='en'?bnLine(sec.note_bn):''}</p>`:''}
    <div id="demo-form">${fieldsHtml}</div>
    <div class="btn-row-between">
      <button class="btn btn-ghost" id="btn-demo-back">${t('Back','পেছনে যান')}</button>
      <button class="btn btn-primary" id="btn-demo-next">${t('Continue','চালিয়ে যান')}</button>
    </div>
  `, {progress: overallProgress()});

  document.getElementById('btn-demo-back').onclick = () => {
    if(state.sectionIdx === 0){ goTo('category'); }
    else { state.sectionIdx -= 1; saveDraft(); renderSection(); }
  };

  document.getElementById('btn-demo-next').onclick = () => {
    let ok = true; let eligibilityFail = null;
    sec.fields.forEach(f=>{
      const wrap = document.querySelector(`#demo-form [data-key="${f.key}"]`);
      const input = wrap.querySelector('input,select');
      const val = input.value;
      const errBox = wrap.querySelector('.error-text');
      if(f.required && (val === '' || val === null)){ ok = false; if(errBox) errBox.classList.add('show'); return; }
      else if(errBox){ errBox.classList.remove('show'); }
      state.demographics[f.key] = val;
      if(f.eligibility){
        if(f.eligibility.failValue && val === f.eligibility.failValue) eligibilityFail = true;
        if(f.eligibility.failIfLessThan !== undefined && val !== '' && Number(val) < f.eligibility.failIfLessThan) eligibilityFail = true;
      }
    });
    if(!ok) return;
    saveDraft();
    if(eligibilityFail){
      saveToFirestore('screened_out', { reason: 'category_criteria_'+state.category });
      screenGoodbye('categoryIneligible');
      return;
    }
    nextSection();
  };
}

/* ---------- checkpoint / re-consent gate ---------- */
function renderCheckpoint(sec){
  frame(`
    <p class="eyebrow">${t('A brief pause','একটু বিরতি')}</p>
    <h2 class="display" lang="${state.lang}">${t(sec.title,sec.title_bn)}</h2>
    <div class="gate-box">${t(sec.text,sec.text_bn)}${state.lang==='en'?bnLine(sec.text_bn):''}</div>
    <div class="actions stack">
      <button class="btn btn-primary" id="btn-gate-continue">${t('Continue to these questions','এই প্রশ্নগুলোতে এগিয়ে যান')}</button>
      <button class="btn btn-quiet" id="btn-gate-skip">${t('Skip just this section','শুধু এই অংশটি এড়িয়ে যান')}</button>
      <button class="btn btn-ghost" id="btn-gate-stop">${t("Stop and submit what I've answered so far",'থামুন এবং এখন পর্যন্ত দেওয়া উত্তরগুলো জমা দিন')}</button>
    </div>
  `, {progress: overallProgress()});

  document.getElementById('btn-gate-continue').onclick = () => nextSection();
  document.getElementById('btn-gate-skip').onclick = () => {
    const cat = CATEGORIES[state.category];
    const nextIdx = state.sectionIdx + 1;
    const targetSectionId = cat.sections[nextIdx] ? cat.sections[nextIdx].id : null;
    if(targetSectionId) state.skippedSections.push(targetSectionId);
    state.sectionIdx += 2; state.itemIdx = 0; saveDraft(); renderSection();
  };
  document.getElementById('btn-gate-stop').onclick = async () => { await submitPartial(); };
}

/* ---------- one-question-at-a-time scale flow ---------- */
function renderScaleItem(sec){
  const item = sec.items[state.itemIdx];
  const scaleKey = sec.mixedScale ? item.scale : sec.scale;
  const scale = SCALES[scaleKey];
  const existing = state.answers[item.code];
  const labels = state.lang==='bn' ? scale.labels_bn : scale.labels;
  const lowLbl = state.lang==='bn' ? scale.low_bn : scale.low;
  const highLbl = state.lang==='bn' ? scale.high_bn : scale.high;

  frame(`
    <p class="scale-section-label">${t(CATEGORIES[state.category].label,CATEGORIES[state.category].label_bn)} ${t('questionnaire','প্রশ্নমালা')} — ${t(sec.title,sec.title_bn)}</p>
    ${sec.note ? `<p class="lede" style="margin-bottom:2px;">${t(sec.note,sec.note_bn)}</p>` : ''}
    <h2 class="scale-question" lang="${state.lang}">${t(item.text,item.text_bn)}</h2>
    ${state.lang==='en' && item.text_bn ? `<p class="scale-question-bn" lang="bn">${item.text_bn}</p>` : ''}
    <div class="scale-track">
      <div class="scale-endlabels">
        <span>${lowLbl}${state.lang==='en'&&scale.low_bn?bnLine(scale.low_bn):''}</span>
        <span>${highLbl}${state.lang==='en'&&scale.high_bn?bnLine(scale.high_bn):''}</span>
      </div>
      <div class="scale-buttons" id="scale-btns">
        ${scale.values.map((v,i)=>`
          <button class="scale-btn ${existing===v?'selected':''}" data-val="${v}">
            <span class="num">${v}</span>
            <span>${labels[i]}</span>
          </button>`).join('')}
      </div>
    </div>
    <div class="btn-row-between">
      <button class="btn btn-ghost" id="btn-scale-back">${t('Back','পেছনে যান')}</button>
      <button class="btn btn-primary" id="btn-scale-next" ${existing===undefined?'disabled':''}>${t('Next','পরবর্তী')}</button>
    </div>
  `, {progress: overallProgress()});

  document.querySelectorAll('#scale-btns .scale-btn').forEach(b=>{
    b.onclick = () => {
      const val = Number(b.dataset.val);
      state.answers[item.code] = val;
      document.querySelectorAll('#scale-btns .scale-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      document.getElementById('btn-scale-next').disabled = false;
      saveDraft();
    };
  });

  document.getElementById('btn-scale-back').onclick = () => {
    if(state.itemIdx > 0){ state.itemIdx -= 1; renderScaleItem(sec); }
    else if(state.sectionIdx > 0){
      state.sectionIdx -= 1;
      const prev = CATEGORIES[state.category].sections[state.sectionIdx];
      state.itemIdx = prev.type==='scale' ? prev.items.length-1 : 0;
      saveDraft(); renderSection();
    } else { goTo('category'); }
  };

  document.getElementById('btn-scale-next').onclick = () => {
    if(state.itemIdx < sec.items.length - 1){ state.itemIdx += 1; saveDraft(); renderScaleItem(sec); }
    else { nextSection(); }
  };
}

/* ---------- open text ---------- */
function renderOpenSection(sec){
  const existing = state.openAnswers[sec.code] || '';
  frame(`
    <p class="eyebrow">${t(CATEGORIES[state.category].label,CATEGORIES[state.category].label_bn)} ${t('questionnaire','প্রশ্নমালা')} — ${t(sec.title,sec.title_bn)}</p>
    <h2 class="display" lang="${state.lang}">${t(sec.prompt,sec.prompt_bn)}</h2>
    ${state.lang==='en'&&sec.prompt_bn ? `<p class="bn-line" style="margin-top:-8px;">${sec.prompt_bn}</p>`:''}
    <p class="lede">${t('Answer in your own words — a sentence or two is plenty. You can also leave this blank.',
      'নিজের ভাষায় উত্তর দিন — এক বা দুই বাক্যই যথেষ্ট। আপনি এটি খালি রেখেও যেতে পারেন।')}</p>
    <div class="field">
      <textarea id="open-text" placeholder="${t('Type your thoughts here…','এখানে আপনার ভাবনা লিখুন…')}">${existing}</textarea>
    </div>
    <div class="btn-row-between">
      <button class="btn btn-ghost" id="btn-open-back">${t('Back','পেছনে যান')}</button>
      <button class="btn btn-primary" id="btn-open-next">${t('Continue','চালিয়ে যান')}</button>
    </div>
  `, {progress: overallProgress()});

  document.getElementById('btn-open-back').onclick = () => {
    if(state.sectionIdx > 0){
      state.sectionIdx -= 1;
      const prev = CATEGORIES[state.category].sections[state.sectionIdx];
      state.itemIdx = prev.type==='scale' ? prev.items.length-1 : 0;
      saveDraft(); renderSection();
    } else goTo('category');
  };
  document.getElementById('btn-open-next').onclick = () => {
    state.openAnswers[sec.code] = document.getElementById('open-text').value.trim();
    saveDraft();
    nextSection();
  };
}

/* ---------- finish / submit ---------- */
async function screenFinish(){
  state.screen = 'finish';
  frame(`
    <p class="eyebrow">${t('Last step','শেষ ধাপ')}</p>
    <h2 class="display" lang="${state.lang}">${t("That's everything",'এটাই সব')}</h2>
    <p class="lede">${t('Thank you for thinking through these questions so carefully — it is not always easy, especially the ones about discipline and family life.',
      'এই প্রশ্নগুলো নিয়ে এত মনোযোগ সহকারে ভাবার জন্য ধন্যবাদ — এটা সবসময় সহজ নয়, বিশেষ করে শাসন ও পারিবারিক জীবন সম্পর্কিত প্রশ্নগুলো।')}</p>
    <p>${t('Ready to send in your answers?','আপনার উত্তরগুলো পাঠাতে প্রস্তুত?')}</p>
    <div class="actions">
      <button class="btn btn-primary" id="btn-submit">${t('Submit my answers','আমার উত্তর জমা দিন')}</button>
    </div>
  `, {progress: 0.97});

  document.getElementById('btn-submit').onclick = async (e) => {
    e.target.disabled = true;
    e.target.innerHTML = `<span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>`;
    const payload = buildPayload('complete');
    const res = await saveToFirestore('submissions', payload);
    clearDraft();
    state._lastRes = res;
    screenThankYou(res);
  };
}

function buildPayload(status){
  return {
    status, category: state.category, demographics: state.demographics, answers: state.answers,
    openAnswers: state.openAnswers, skippedSections: state.skippedSections, screening: state.screening,
    language: state.lang,
    durationSeconds: state.startedAt ? Math.round((Date.now()-state.startedAt)/1000) : null
  };
}

async function submitPartial(){
  const payload = buildPayload('partial_stopped');
  await saveToFirestore('partial_exits', payload);
  clearDraft();
  screenGoodbye('partialStopped');
}

function screenThankYou(res){
  state.screen = 'thankyou'; state._lastRes = res;
  frame(`
    <p class="eyebrow"><span class="kicker-dot"></span>${t('Thank you','ধন্যবাদ')}</p>
    <h2 class="display" lang="${state.lang}">${t('Your answers have been recorded','আপনার উত্তর রেকর্ড করা হয়েছে')}</h2>
    <p class="lede">${t("This research is trying to say something true about how children are raised here, and what they're owed. You've just helped make that possible.",
      'এই গবেষণা এখানে সন্তানরা কীভাবে বড় হয় এবং তাদের প্রতি কী দায়বদ্ধতা রয়েছে সে সম্পর্কে সত্য কিছু বলার চেষ্টা করছে। আপনি এইমাত্র তা সম্ভব করতে সাহায্য করলেন।')}</p>
    ${res && res.offline ? `<p class="fine">${t("(Note: this deployment isn't yet connected to a live database, so your response was only logged to the browser console for testing.)",
      '(দ্রষ্টব্য: এই সংস্করণটি এখনো কোনো লাইভ ডেটাবেসের সাথে সংযুক্ত নয়, তাই আপনার উত্তর শুধু পরীক্ষার জন্য ব্রাউজার কনসোলে লগ করা হয়েছে।)')}</p>` : ''}
    <p class="fine">${t('You may close this tab now.','আপনি এখন এই ট্যাবটি বন্ধ করতে পারেন।')}</p>
    ${foot()}
  `);
}

/* =========================================================
   ROUTER
   ========================================================= */
function resetState(){
  state.screen='hero'; state.category=null; state.sectionIdx=0; state.itemIdx=0;
  state.answers={}; state.demographics={}; state.openAnswers={}; state.skippedSections=[];
  state.startedAt=null; state.screening={}; state._lastGoodbyeKey=null; state._lastRes=null;
  clearDraft();
}

function goTo(screen){
  state.screen = screen;
  if(screen==='hero') return screenHero();
  if(screen==='about') return screenAbout();
  if(screen==='consent') return screenConsent();
  if(screen==='screening') return screenScreening();
  if(screen==='category') return screenCategory();
}

function renderCurrentScreen(){
  updateLangButtons();
  switch(state.screen){
    case 'hero': return screenHero();
    case 'about': return screenAbout();
    case 'consent': return screenConsent();
    case 'screening': return screenScreening();
    case 'category': return screenCategory();
    case 'survey': return renderSection();
    case 'finish': return screenFinish();
    case 'thankyou': return screenThankYou(state._lastRes);
    case 'goodbye': return screenGoodbye(state._lastGoodbyeKey || 'declineConsent');
    default: return screenHero();
  }
}

/* language toggle wiring (persists across every screen) */
document.getElementById('lang-en').addEventListener('click', () => { state.lang='en'; saveDraft(); renderCurrentScreen(); });
document.getElementById('lang-bn').addEventListener('click', () => { state.lang='bn'; saveDraft(); renderCurrentScreen(); });

/* =========================================================
   BOOT — resume a draft if one exists
   ========================================================= */
(function boot(){
  const draft = loadDraft();
  if(draft){
    Object.assign(state, draft);
    updateLangButtons();
    if(draft.category && draft.screen && draft.screen !== 'hero'){
      renderCurrentScreen();
      return;
    }
  }
  updateLangButtons();
  screenHero();
})();
</script>
</body>
</html>
